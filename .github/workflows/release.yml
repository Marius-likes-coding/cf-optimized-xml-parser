name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: jdx/mise-action@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run fixtures:generate
      - run: npm test
      - run: npm run build
      - name: semantic-release (npm publish via OIDC, no NPM_TOKEN)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: npm CLI uses the OIDC id-token automatically.
          # One-time setup: publish package once manually, then add this repo's
          # release.yml as Trusted Publisher at npmjs.com/package/cf-optimized-xml-parser/settings.
