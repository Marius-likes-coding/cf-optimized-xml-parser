name: perf
# Paired benchmarks: base and candidate run interleaved in the same process (local workerd) or
# the same Workers (Cloudflare), so machine drift and hardware differences hit both alike.
# perf-local gates (a required check on main); perf-remote reports only (bench/README.md).
# Base: the base branch tip for pull requests and pushes, the latest release for scheduled runs.
# Thresholds, fixtures and shards: bench/gates.json. Details: bench/README.md.
on:
  pull_request:
    # labeled/unlabeled: the perf-regression-accepted and perf-remote labels change the run.
    # Every label change reruns the checks, because a skipped rerun would count as a pass.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref (empty: latest release tag; HEAD: an A/A run for calibration)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE: ${{ inputs.base }}
  PERF_REGRESSION_ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-accepted') }}

jobs:
  # What this run measures. bench: false when the change touches nothing the benchmarks measure
  # (docs, research, tests), so such pull requests pass in seconds. remote: on pull requests only
  # with the perf-remote label. shards: the runners; each measures every fixture.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bench: ${{ steps.scope.outputs.bench }}
      remote: ${{ steps.scope.outputs.remote }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          REMOTE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf-remote') }}
        run: |
          # HEAD^1: the base branch tip (pull_request checks out the merge commit) or the previous
          # main commit (push), as in scripts/bench-lib.mjs resolveBase().
          measured="src scripts bench/gates.json package.json package-lock.json mise.toml tsconfig.json .github/workflows/perf.yml .github/actions"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || ! git diff --quiet HEAD^1 HEAD -- $measured; then
            bench=true
          else
            bench=false
          fi
          remote=false
          if [ "$bench" = true ] && { [ "$EVENT" != pull_request ] || [ "$REMOTE_LABEL" = true ]; }; then
            remote=true
          fi
          {
            echo "bench=$bench"
            echo "remote=$remote"
            echo "shards=$(jq -c '[range(1; .local.shards + 1)]' bench/gates.json)"
          } >> "$GITHUB_OUTPUT"
          echo "bench=$bench remote=$remote"

  perf-local-shard:
    needs: scope
    if: needs.scope.outputs.bench == 'true'
    name: perf-local shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Every shard measures every fixture (bench-merge.mjs combines the runners). taskset keeps
      # workerd off vCPU 0, where the runner agent works; it narrowed A/A intervals slightly.
      - run: taskset -c "1-$(($(nproc) - 1))" npm run bench:pr
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: shard-local-${{ matrix.shard }}
          path: bench/results/perf-local.json
          if-no-files-found: ignore
          retention-days: 7

  # The required check: merges the shards' reports and applies the gate. Always runs, so a
  # skipped or failed shard can't count as a pass.
  perf-local:
    needs: [scope, perf-local-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          BENCH: ${{ needs.scope.outputs.bench }}
        run: |
          if [ "$SCOPE" != success ]; then
            echo "The scope job ended with '$SCOPE'."
            exit 1
          fi
          if [ "$BENCH" != true ]; then
            echo "Skipped: this change touches nothing the benchmarks measure." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v6
        if: needs.scope.outputs.bench == 'true'
      - uses: jdx/mise-action@v2
        if: needs.scope.outputs.bench == 'true'
      # A missing shard report fails the merge below, not this step.
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.bench == 'true'
        continue-on-error: true
        with:
          pattern: shard-local-*
          path: bench/results/shards
      - if: needs.scope.outputs.bench == 'true'
        run: node scripts/bench-merge.mjs bench/results/shards/*/perf-local.json
      - uses: actions/upload-artifact@v5
        if: always() && needs.scope.outputs.bench == 'true'
        with:
          name: perf-local
          path: bench/results/perf-local.json
          if-no-files-found: ignore

  perf-remote:
    needs: scope
    if: needs.scope.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d1614c307ac7e99df62e04fe6b3f6933
      BENCH_WORKER_NAME: cfxp-bench-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      skipped: ${{ steps.token.outputs.skipped }}
    steps:
      # Pull requests from forks and Dependabot get no secrets: report and pass instead of failing.
      - id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Remote bench skipped: no Cloudflare token (fork or Dependabot pull request)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.skipped == 'false'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: steps.token.outputs.skipped == 'false'
      - if: steps.token.outputs.skipped == 'false'
        run: npm run bench:pr:remote
      # The script deletes its Workers; this covers a cancelled or killed run.
      - if: always() && steps.token.outputs.skipped == 'false'
        run: |
          mkdir -p .bench && cd .bench
          workers=$(node -p 'require("../bench/gates.json").remote.workers')
          for index in $(seq 0 $((workers - 1))); do
            ../node_modules/.bin/wrangler delete --name "$BENCH_WORKER_NAME-w$index" --force >/dev/null 2>&1 || true
          done
      - uses: actions/upload-artifact@v5
        if: always() && steps.token.outputs.skipped == 'false'
        with:
          name: perf-remote
          path: bench/results/perf-remote.json
          if-no-files-found: ignore

  perf-report:
    if: always() && github.event_name == 'pull_request'
    needs: [scope, perf-local, perf-remote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: perf-*
          merge-multiple: true
          path: bench/results
      - run: node scripts/bench-report.mjs --comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LOCAL_RESULT: ${{ needs.perf-local.result }}
          REMOTE_RESULT: ${{ needs.perf-remote.result }}
          BENCH: ${{ needs.scope.outputs.bench }}
          REMOTE: ${{ needs.scope.outputs.remote }}
          REMOTE_SKIPPED: ${{ needs.perf-remote.outputs.skipped }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Separate job, so only this step gets write access. Records main's and the nightly's numbers
  # even when a comparison flagged a regression, so the history shows it.
  record-history:
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    needs: [perf-local, perf-remote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: perf-*
          merge-multiple: true
          path: bench/results
      - run: |
          if [ -f bench/results/perf-local.json ]; then
            node scripts/bench-record.mjs bench/results/perf-local.json local
          fi
          if [ -f bench/results/perf-remote.json ]; then
            node scripts/bench-record.mjs bench/results/perf-remote.json remote
          fi

  # Deletes per-run bench Workers that a dead run left behind.
  sweep-workers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
      - run: node scripts/bench-sweep.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1614c307ac7e99df62e04fe6b3f6933
