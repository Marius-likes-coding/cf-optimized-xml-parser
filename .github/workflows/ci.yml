name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run publint
      - run: npm run attw
      - run: npm run size

  unit-workerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fixtures:generate
      - run: npm test

  bench-compare:
    runs-on: ubuntu-latest
    needs: [unit-workerd]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fixtures:generate
      - name: Restore baseline (latest local run recorded from main)
        run: |
          LATEST=""
          if git fetch --quiet origin bench-history; then
            LATEST=$(git ls-tree --name-only FETCH_HEAD local/ | sort | tail -n 1)
          fi
          if [ -n "$LATEST" ]; then
            git show "FETCH_HEAD:$LATEST" > bench/results/baseline.json
            echo "baseline=$LATEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No history yet — first run."
          fi
      - name: Run bench
        run: npx vitest bench --run --project workers --outputJson=bench/results/vitest-bench.json
      - run: node scripts/bench-save.mjs bench/results/vitest-bench.json bench/results/current.json
      - run: node scripts/bench-compare.mjs
        env:
          REGRESSION_THRESHOLD: 10
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-current
          path: bench/results/current.json

  # Separate job so only this step gets write access. Records main's numbers even when the
  # compare flagged a regression; otherwise an accepted slowdown would stay the baseline forever.
  record-history:
    runs-on: ubuntu-latest
    needs: [bench-compare]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.bench-compare.result == 'success' || needs.bench-compare.result == 'failure') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v5
        with:
          name: bench-current
          path: bench/results
      - run: node scripts/bench-record.mjs bench/results/current.json local
