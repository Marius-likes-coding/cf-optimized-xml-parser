name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run publint
      - run: npm run attw
      - run: npm run size

  unit-workerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: npm run fixtures:generate
      - run: npm test
      # Mutation fuzzing: parse() must return a document or throw XmlError, never crash or hang.
      - run: npm run fuzz
        env:
          ITERATIONS: 50000

  # W3C XML Conformance Test Suite. Every remaining failure is a documented scope decision
  # (research/conformance.md); raise the floor as fixes land.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .cache/xmlconf
          key: xmlconf-xmlts20130923
      - run: npm run conformance
        env:
          MIN_PASS_RATE: 72.7

  # Performance runs in perf.yml: paired local and remote comparisons against the base branch.
