# Remote check of the released parser's warmup() only: deploys under the bench Worker's name.
# Restore the real bench afterwards with `npx wrangler deploy` from the repo root.
name = "cf-optimized-xml-parser-bench"
main = "final-worker.ts"
compatibility_date = "2026-08-01"
account_id = "d1614c307ac7e99df62e04fe6b3f6933"

[observability]
enabled = true

# Fixtures are bundled as text modules, so every isolate has them without a prepare step.
[[rules]]
type = "Text"
globs = ["**/*.xml"]
fallthrough = true
